<main>
  <h1>Project members</h1>
  <label class="search-label">
    Find a person
    <input type="search" placeholder="Search people…" [value]="searchTerm"
      [disabled]="!addProjectMemberService.selectionReady" (input)="onSearchInput($event)" />
  </label>
  <button *ngIf="searchMode" type="button" (click)="clearSearch()">Clear search</button>
  <div class="status" aria-live="polite">
    <span *ngIf="treeRoot.loading || searching">Loading…</span>
    <span *ngIf="searchMode && searchTooManyResults">Too many results. Please refine your search.</span>
    <span *ngIf="treeRoot.error" class="error">
      {{ treeRoot.error }} <button type="button" (click)="retryInitialization()">Retry</button>
    </span>
    <span *ngIf="searchError" class="error">
      {{ searchError }} <button type="button" (click)="retrySearch()">Retry search</button>
    </span>
  </div>
  <ws-tree [nodes]="treeNodes" label="Project members"
    (expand)="onNodeExpand($event)" (selectionChange)="onSelectionChange($event)">
  </ws-tree>
  <p class="empty" *ngIf="!treeRoot.loading && !searching && !treeRoot.error && !searchError && !treeNodes.length">
    {{ searchMode ? 'No people found.' : 'No chains to display.' }}
  </p>
</main>
