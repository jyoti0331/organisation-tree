<section class="picker" [attr.aria-label]="label">
  <ul class="tree-list" [attr.aria-label]="label">
    <ng-container *ngTemplateOutlet="treeTemplate; context: { $implicit: nodes, depth: 0 }"></ng-container>
  </ul>
</section>

<ng-template #treeTemplate let-items let-depth="depth">
  <li *ngFor="let node of items; trackBy: trackNode">
    <ws-tree-row [node]="node" [depth]="depth" (expand)="onExpand($event)" (selectionChange)="onCheckboxChange($event)"></ws-tree-row>
    <ul *ngIf="node.expanded && node.children?.length" class="tree-list">
      <ng-container *ngTemplateOutlet="treeTemplate; context: { $implicit: node.children, depth: depth + 1 }"></ng-container>
    </ul>
  </li>
</ng-template>
